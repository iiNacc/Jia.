<title>Player{position:relative;width:100%;padding:24px 28px;border-radius:28px;overflow:hidden;background:linear-gradient(180deg,#222222 0%,#151515 22%,#0D0D0D 58%,#050505 100%);border:1px solid rgba(255,255,255,.06);box-shadow:0 40px 90px rgba(0,0,0,.82),inset 0 1px 1px rgba(255,255,255,.10),inset 0 -16px 28px rgba(0,0,0,.65);transition:transform .45s cubic-bezier(.22,.61,.36,1),box-shadow .45s ease;}
